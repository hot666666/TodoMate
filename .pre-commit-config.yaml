repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.0.1
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/nicklockwood/SwiftFormat
    rev: 0.53.6
    hooks:
    -   id: swiftformat
        args:
        - "--config"
        - ".swiftformat"
-   repo: https://github.com/realm/SwiftLint
    rev: 0.55.1
    hooks:
    -   id: swiftlint
        args:
        - "autocorrect"
        - "--format"
        - "--config"
        - ".swiftlint.yml"


