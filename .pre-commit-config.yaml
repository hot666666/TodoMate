repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/nicklockwood/SwiftFormat
    rev: 0.58.7
    hooks:
    -   id: swiftformat
        args:
        - "--config"
        - ".swiftformat"
-   repo: https://github.com/realm/SwiftLint
    rev: 0.63.0
    hooks:
    -   id: swiftlint
        args:
        - "--fix"
        - "--config"
        - ".swiftlint.yml"
