<script>

function drawEdges(){const svg=$('edges'),wrap=svg.parentElement,base=wrap.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${wrap.scrollWidth} ${wrap.scrollHeight}`);svg.innerHTML='';for(const e of model.relationships){const a=document.querySelector(`.node[data-id="${CSS.escape(e.sourceId)}"]`),b=document.querySelector(`.node[data-id="${CSS.escape(e.targetId)}"]`);if(!a||!b)continue;const ar=a.getBoundingClientRect(),br=b.getBoundingClientRect(),x1=ar.left-base.left+wrap.scrollLeft+ar.width/2,y1=ar.top-base.top+wrap.scrollTop+ar.height/2,x2=br.left-base.left+wrap.scrollLeft+br.width/2,y2=br.top-base.top+wrap.scrollTop+br.height/2;svg.insertAdjacentHTML('beforeend',`<line class="edge" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`)}}
function related(id,direction){return model.relationships.filter(e=>direction==='up'?e.sourceId===id:e.targetId===id).map(e=>direction==='up'?e.targetId:e.sourceId)}function documentFor(target){return model.documents.find(d=>d.documentId===target.documentId)}function feedbackMarkup(target){const items=model.feedback.filter(f=>f.targetId===target.id&&f.targetDocumentId===target.documentId);return `<section class="feedback"><h3>Discuss ${escapeHTML(target.id)}</h3><div>${items.map(f=>`<div class="feedback-card ${escapeHTML(f.reviewState)}"><b>${escapeHTML(f.category)} · ${escapeHTML(f.status)} · ${escapeHTML(f.reviewState)}</b><div>${escapeHTML(f.request)}</div>${f.context&&f.context!=='-'?`<div class="count">${escapeHTML(f.context)}</div>`:''}${f.responses.map(r=>`<div class="relation"><b>${escapeHTML(r.disposition)} · ${escapeHTML(r.confidence)}</b><div>${escapeHTML(r.answer)}</div><div class="source">${escapeHTML(r.evidence)}</div>${r.unresolvedReason&&r.unresolvedReason!=='-'?`<div class="count">${escapeHTML(r.unresolvedReason)}</div>`:''}</div>`).join('')}</div>`).join('')||'<div class="count">No recorded feedback.</div>'}</div><label>Category<select id="feedbackCategory"><option>question</option><option>factual-error</option><option>missing</option><option>wrong-relationship</option><option>improvement</option><option>code-change-request</option></select></label><label>Question or request<textarea id="feedbackRequest" maxlength="4000"></textarea></label><label>Relationship or trace context<input id="feedbackContext" maxlength="1000"></label><div class="actions"><button type="button" id="feedbackExport">Export JSON</button><button type="button" id="feedbackSave">Save localhost</button></div><div id="feedbackStatus" class="count"></div></section>`}function feedbackPayload(target){const document=documentFor(target);return{targetId:target.id,targetDocumentId:target.documentId,verifiedGitCommit:document.verifiedGitCommit,category:$('feedbackCategory').value,request:$('feedbackRequest').value.trim(),context:$('feedbackContext').value.trim()}}function bindFeedback(target){const status=$('feedbackStatus'),valid=()=>{const ok=$('feedbackRequest').value.trim().length>0;$('feedbackExport').disabled=!ok;$('feedbackSave').disabled=!ok||!loopback;return ok},loopback=location.protocol==='http:'&&['127.0.0.1','localhost','::1'].includes(location.hostname);$('feedbackRequest').oninput=valid;valid();$('feedbackExport').onclick=()=>{if(!valid())return;const payload=feedbackPayload(target),blob=new Blob([JSON.stringify(payload,null,2)+'\n'],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`architecture-feedback-${target.id}.json`;link.click();URL.revokeObjectURL(url);status.textContent='Feedback JSON exported. Give it to an Agent for review.'};$('feedbackSave').onclick=async()=>{if(!valid())return;status.textContent='Saving…';try{const response=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(feedbackPayload(target))}),body=await response.json();if(!response.ok)throw new Error(body.error||`HTTP ${response.status}`);status.textContent=`Saved ${body.feedbackId} (${body.status}). Rebuild after Agent review.`}catch(error){status.textContent=`Save failed: ${error.message}`}}}function traceTarget(traceId){const rows=model.traces.filter(s=>s.traceId===traceId),first=rows[0];return{id:traceId,documentId:first.documentId,summary:`Runtime trace with ${rows.length} steps`,kind:'trace',module:first.modelLayer,status:'observed',confidence:'high',source:unique(rows.map(r=>r.evidence)).join('; ')}}function inspectFeedbackTarget(target){$('inspector').innerHTML=`<dl><dt>ID</dt><dd>${escapeHTML(target.id)}</dd><dt>Summary</dt><dd>${escapeHTML(target.summary)}</dd><dt>Kind / module</dt><dd>${escapeHTML(target.kind)} · ${escapeHTML(target.module)}</dd><dt>Source evidence</dt><dd class="source">${escapeHTML(target.source).replaceAll(';',';<br>')}</dd></dl>${feedbackMarkup(target)}`;bindFeedback(target);history.replaceState(null,'',`#feedback=${encodeURIComponent(target.id)}`)}function selectNode(id,push=true){selected=id;neighborhood=new Set([id,...related(id,'up'),...related(id,'down')]);const n=byId.get(id);if(!n)return;const outgoing=model.relationships.filter(e=>e.sourceId===id),incoming=model.relationships.filter(e=>e.targetId===id);$('inspector').innerHTML=`<dl><dt>ID</dt><dd>${escapeHTML(n.id)}</dd><dt>Summary</dt><dd>${escapeHTML(n.summary)}</dd><dt>Kind / module</dt><dd>${escapeHTML(n.kind)} · ${escapeHTML(n.module)}</dd><dt>Status / confidence</dt><dd>${escapeHTML(n.status)} · ${escapeHTML(n.confidence)}</dd><dt>Source evidence</dt><dd class="source">${escapeHTML(n.source).replaceAll(';',';<br>')}</dd></dl><div class="actions"><button id="upstream">Upstream ${outgoing.length}</button><button id="downstream">Downstream ${incoming.length}</button><button id="clear">Clear</button></div><h3>Relationships</h3><div>${[...outgoing,...incoming].map(e=>`<div class="relation"><b>${escapeHTML(e.sourceId)} ${escapeHTML(e.kind)} ${escapeHTML(e.targetId)}</b><div class="source">${escapeHTML(e.evidence)}</div></div>`).join('')||'<span class="count">None</span>'}</div>${feedbackMarkup(n)}`;$('upstream').onclick=()=>highlight([id,...related(id,'up')]);$('downstream').onclick=()=>highlight([id,...related(id,'down')]);$('clear').onclick=()=>{selected=null;neighborhood.clear();$('inspector').textContent='Select an element to inspect its source evidence and relationships.';renderGraph()};bindFeedback(n);if(push)history.replaceState(null,'',`#node=${encodeURIComponent(id)}`);renderGraph()}
