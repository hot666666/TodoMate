name: Deploy message test
on: push

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit message from latest commit
        id: get_commit_message
        run: |
          # 최신 커밋의 메시지를 가져옴
          COMMIT_MESSAGE=$(git log -1 --pretty=%B "${{ github.sha }}")
          # 줄바꿈을 제거하고 단일 줄로 변환
          SAFE_MESSAGE=$(echo "$COMMIT_MESSAGE" | tr '\n' ' ' | sed 's/  */ /g')
          echo "message=$SAFE_MESSAGE" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Debug commit message
        run: |
          echo "Processed message: ${{ steps.get_commit_message.outputs.message }}"
